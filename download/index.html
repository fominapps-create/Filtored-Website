    <style>
        .dl-wrap {
            max-width: var(--maxw);
            margin: 0 auto;
            padding: 1rem clamp(1rem, 2.5vw, 2rem) 4rem;
        }

        .dl-panel {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            min-height: 610px;
            background: linear-gradient(135deg, #fffaf4 0%, #f0af74 100%);
            border: 1px solid rgba(194, 65, 12, 0.1);
            border-radius: 36px;
            padding: clamp(2.5rem, 6vw, 5rem) clamp(1.5rem, 6vw, 6rem);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: clamp(2.5rem, 6vw, 5rem);
        }

        .dl-copy,
        .dl-phones {
            position: relative;
            z-index: 1;
        }

        .dl-copy {
            flex: 1 1 auto;
            min-width: 0;
        }

        .dl-copy h1 {
            color: var(--ink);
        }

        .dl-copy h1 {
            margin-bottom: 1.2rem;
            color: var(--ink);
            font-size: clamp(2.5rem, 5.5vw, 4.6rem);
            line-height: 1.03;
        }

        .dl-eyebrow {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin: 0 0 1.2rem;
            color: var(--ink);
            font-family: 'Sora', 'Inter', sans-serif;
            font-size: clamp(1.5rem, 2.6vw, 2.2rem);
            font-weight: 800;
            letter-spacing: -0.01em;
        }

        .dl-lede {
            max-width: 32rem;
            margin-bottom: 1.8rem;
            color: var(--ink-soft);
            font-size: clamp(1.05rem, 1.8vw, 1.3rem);
        }

        .dl-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .dl-copy h1 {
            font-size: clamp(2.8rem, 5.5vw, 4.6rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.8rem;
        }

        .dl-note {
            margin-top: 1.3rem;
            font-size: 0.9rem;
            color: var(--ink-soft);
        }

        /* CSS phone frame around the app screenshot */
        .dl-phone {
            position: relative;
            flex: 0 0 300px;
            width: 300px;
            border-radius: 44px;
            border: 10px solid var(--ink);
            background: var(--ink);
            box-shadow: 0 40px 80px -36px rgba(28, 25, 23, 0.45);
            overflow: hidden;
        }

        .dl-phones {
            position: relative;
            flex: 0 0 320px;
            width: 320px;
            height: 627px;
            margin-right: clamp(0px, 8vw, 150px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dl-phones::before {
            content: "";
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .dl-phones::before {
            top: 50%;
            left: 50%;
            width: 540px;
            height: 540px;
            background: linear-gradient(180deg, rgba(194, 65, 12, 0.16) 0%, rgba(255, 250, 244, 0.58) 100%);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, 0.6),
                0 24px 50px -20px rgba(28, 25, 23, 0.25);
            transform: translate(-50%, -50%);
        }

        .dl-phones .dl-phone {
            position: absolute;
            top: 0;
            left: 50%;
            z-index: 2;
            transform: translateX(-50%);
        }

        .dl-phones .dl-phone-back {
            flex-basis: 255px;
            z-index: 1;
            bottom: -10px;
            width: 255px;
            filter: saturate(0.8) brightness(0.82);
            box-shadow: 0 30px 60px -32px rgba(28, 25, 23, 0.5);
        }

        .dl-phone-back-left {
            transform: translateX(calc(-50% - 120px)) rotate(-14deg);
        }

        .dl-phone-back-right {
            transform: translateX(calc(-50% + 120px)) rotate(14deg);
        }

        .dl-phone-main::before {
            content: "";
            position: absolute;
            top: 14px;
            left: 50%;
            z-index: 3;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #000;
            transform: translateX(-50%);
        }

        .dl-phone img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 34px;
        }

        @media (max-width: 860px) {
            .dl-panel {
                flex-direction: column;
                text-align: center;
            }
            .dl-phones {
                flex-basis: auto;
                width: 320px;
                height: 627px;
                transform: scale(0.86);
                transform-origin: top center;
                margin-top: 2.5rem;
                margin-right: 0;
                margin-bottom: -85px;
            }
            .dl-copy h1 { margin-bottom: 1.4rem; }
            .dl-eyebrow,
            .dl-actions { justify-content: center; }
            .dl-features { justify-content: center; }
        }

        @media (max-width: 520px) {
            .dl-phones {
                margin-top: -1rem;
            }
        }

        /* Entrance animations */
        @keyframes dl-fade-up {
            from { opacity: 0; transform: translateY(44px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes dl-phone-in {
            from { opacity: 0; transform: translateX(-50%) translateY(70px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        @keyframes dl-circle-in {
            from { opacity: 0; transform: translate(-50%, -38%) scale(0.82); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .dl-copy h1 { animation: dl-fade-up 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both; }
        .dl-lede { animation: dl-fade-up 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both; }
        .dl-actions { animation: dl-fade-up 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both; }
        .dl-phones::before { animation: dl-circle-in 1s cubic-bezier(0.22, 1, 0.36, 1) 0.25s both; }
        .dl-phones .dl-phone { animation: dl-phone-in 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.4s both; }

        @media (prefers-reduced-motion: reduce) {
            .dl-copy h1,
            .dl-lede,
            .dl-actions,
            .dl-phones::before,
            .dl-phones .dl-phone { animation: none; }
        }
    </style>

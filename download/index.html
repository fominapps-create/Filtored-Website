        .dl-wrap {
            max-width: var(--maxw);
            margin: 0 auto;
            padding: 1rem clamp(1rem, 2.5vw, 2rem) 4rem;
        }

        .dl-panel {
            background: linear-gradient(180deg, #eee4d7 0%, #f5ede3 100%);
            border: 1px solid rgba(194, 65, 12, 0.08);
            border-radius: 36px;
            padding: clamp(2.5rem, 6vw, 5rem) clamp(1.5rem, 6vw, 6rem);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: clamp(2.5rem, 6vw, 5rem);
        }

        .dl-copy h1 {
            font-size: clamp(2.1rem, 4.5vw, 3.4rem);
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 1.8rem;
        }

        .dl-note {
            margin-top: 1.3rem;
            font-size: 0.9rem;
            color: var(--ink-soft);
        }

        /* CSS phone frame around the app screenshot */
        .dl-phone {
            flex: 0 0 auto;
            width: clamp(240px, 26vw, 320px);
            border-radius: 44px;
            border: 10px solid var(--ink);
            background: var(--ink);
            box-shadow: 0 40px 80px -36px rgba(28, 25, 23, 0.45);
            overflow: hidden;
        }

        .dl-phone img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 34px;
        }

        @media (max-width: 860px) {
            .dl-panel {
                flex-direction: column;
                text-align: center;
            }
            .dl-copy h1 { margin-bottom: 1.4rem; }
        }
    </style>
